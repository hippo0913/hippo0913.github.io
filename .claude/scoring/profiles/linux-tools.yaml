# Linux 工具教程系列评分配置
name: Linux 工具教程
description: Linux 环境配置和工具使用教程的评分标准

articles_dir: source/_posts/linux-tools
template: linux-tools-template.md

source:
  instruction: "使用 Read 工具读取文章 Front Matter 中 source_file 字段指向的本地文件作为参考材料，从中提取核心步骤、代码示例、配置说明和验证方法"

quantitative:
  weight: 0.3
  checks:
    - id: codeBlocks
      name: 代码块
      checker: regex_count
      pattern: '```[\w]*\n[\s\S]*?```'
      threshold: 2
      score: 20
      operator: ">="

    - id: configExamples
      name: 配置示例
      checker: code_lang_count
      languages: [yaml, json, bash, toml]
      threshold: 1
      score: 15

    - id: tables
      name: 表格
      checker: regex_count
      pattern: '\|\s*[-:]+.*\|'
      threshold: 1
      score: 15

    - id: wordCount
      name: 字数
      checker: chinese_char_count
      threshold: 1000
      score: 20

    - id: platitudes
      name: 空话检测
      checker: blacklist
      patterns:
        - '实践出真知'
        - '不如自己动手试一次'
        - '功能体系中的重要组成部分'
        - '让我们一起.*吧'
        - '以上就是.*的全部内容'
        - '相信你.*掌握了'
      threshold: 0
      score: 15
      operator: "<="

    - id: frontMatter
      name: Front Matter 完整性
      checker: front_matter
      required_fields: [title, date, tags, categories, description, cover]
      threshold: 6
      score: 15

qualitative:
  weight: 0.7
  dimensions:
    - id: contentDepth
      name: 教程可操作性
      maxScore: 25
      description: 每个步骤是否有具体的命令和说明，读者能否跟着一步步做完，是否有前置条件和预期结果

    - id: codeUsability
      name: 代码实用性
      maxScore: 25
      description: 命令和配置是否可以直接复制执行，是否有注释说明，是否覆盖核心使用场景

    - id: personalExperience
      name: 踩坑经验真实性
      maxScore: 20
      description: 是否有具体的报错信息和解决步骤，建议是否实用而非空话，经验描述是否可信

    - id: structure
      name: 结构可读性
      maxScore: 15
      description: 文章是否按合理的步骤顺序组织，段落长度是否适中，是否有有效的过渡和总结

    - id: accuracy
      name: 技术准确性
      maxScore: 15
      description: 命令是否正确，依赖关系是否准确，版本号和路径是否有效

pass:
  threshold: 70
  maxIterations: 3
